<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Card - Tailwind</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans bg-gray-100 flex justify-center items-center min-h-screen">

  <div class="relative w-80 bg-white rounded-xl shadow-lg overflow-hidden">
    <div class="p-4">
      <span class="inline-block bg-red-500 text-white text-xs font-bold px-2.5 py-1 rounded-full mb-3">New</span>
      <h2 class="text-lg font-bold text-gray-900 mb-2">Wireless Headphones</h2>
      <p class="text-sm text-gray-500 leading-relaxed mb-4">
        Premium sound quality with active noise cancellation and 30-hour battery life.
      </p>

      <div class="flex justify-between items-center mb-3">
        <span class="text-xl font-bold text-gray-900">$129.00</span>
        <span class="text-sm text-amber-500 font-semibold">★ 4.8</span>
      </div>

      <div class="flex gap-2 mb-4">
        <span class="text-xs text-blue-600 bg-blue-100 px-2.5 py-1 rounded-md">Audio</span>
        <span class="text-xs text-blue-600 bg-blue-100 px-2.5 py-1 rounded-md">Wireless</span>
      </div>

      <button class="w-full bg-blue-600 text-white text-sm font-bold py-2.5 rounded-lg border-none cursor-pointer">
        Add to Cart
      </button>
    </div>
  </div>

</body>
</html>
