<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Card - Fomantic UI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fomantic-ui/2.9.4/semantic.min.css">
  <style>
    body {
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
  </style>
</head>
<body>

  <div class="ui card" style="width: 320px;">
    <div class="content">
      <div class="ui red horizontal label">New</div>
      <div class="header">Wireless Headphones</div>
      <div class="description">
        Premium sound quality with active noise cancellation and 30-hour battery life.
      </div>
    </div>
    <div class="content">
      <div class="ui two column grid">
        <div class="column">
          <span style="font-size: 1.3em; font-weight: bold;">$129.00</span>
        </div>
        <div class="right aligned column">
          <span style="color: #f59e0b; font-weight: bold;">★ 4.8</span>
        </div>
      </div>
    </div>
    <div class="content">
      <a class="ui tag label">Audio</a>
      <a class="ui tag label">Wireless</a>
    </div>
    <div class="ui bottom attached primary button">Add to Cart</div>
  </div>

</body>
</html>
