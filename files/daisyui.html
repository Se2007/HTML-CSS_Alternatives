<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Card - DaisyUI</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">

  <div class="card w-80 bg-base-10 shadow-lg rounded-xl">
    <div class="card-body p-4">
      <div class="badge badge-error text-white mb-3">New</div>
      <h2 class="card-title text-lg mb-2">Wireless Headphones</h2>
      <p class="text-sm text-gray-500 leading-relaxed mb-4">
        Premium sound quality with active noise cancellation and 30-hour battery life.
      </p>

      <div class="flex justify-between items-center mb-3">
        <span class="text-xl font-bold text-gray-900">$129.00</span>
        <span class="text-sm text-warning font-semibold">★ 4.8</span>
      </div>

      <div class="flex gap-2 mb-4">
        <span class="badge badge-info badge-outline">Audio</span>
        <span class="badge badge-info badge-outline">Wireless</span>
      </div>

      <button class="btn btn-primary w-full">Add to Cart</button>
    </div>
  </div>

</body>
</html>
