<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Card - Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f3f4f6; }
  </style>
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

  <div class="card shadow-lg border-0 rounded-4" style="width: 320px;">
    <div class="card-body p-4">
      <span class="badge rounded-pill bg-danger mb-3">New</span>
      <h2 class="fs-5 fw-bold text-dark mb-2">Wireless Headphones</h2>
      <p class="card-text text-secondary small mb-4">
        Premium sound quality with active noise cancellation and 30-hour battery life.
      </p>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="fs-4 fw-bold text-dark">$129.00</span>
        <span class="small text-warning fw-semibold">★ 4.8</span>
      </div>

      <div class="d-flex gap-2 mb-4">
        <span class="badge bg-primary-subtle text-primary-emphasis rounded-2">Audio</span>
        <span class="badge bg-primary-subtle text-primary-emphasis rounded-2">Wireless</span>
      </div>

      <button class="btn btn-primary w-100 fw-bold">Add to Cart</button>
    </div>
  </div>

</body>
</html>
